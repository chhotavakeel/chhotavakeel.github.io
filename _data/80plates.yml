# Content for /80plates (pages/80plates.html).
# Each city can have any number of tickets. Leave `photo` out for a
# placeholder. `kind` is the label above the item (DRINK or SNACK).
# Optional per ticket: photo, alt, time, location, date.
# Keep "on" quoted: unquoted, YAML reads it as true.

