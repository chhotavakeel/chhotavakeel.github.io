<script>
(function () {
  var blades = document.currentScript.previousElementSibling.querySelector('.windmill-blades');
  if (!blades) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var step = 0;
  var STEPS = 24;
  var INTERVAL = 500;
  setInterval(function () {
    step = (step + 1) % STEPS;
    blades.setAttribute('transform', 'rotate(' + (step * (360 / STEPS)) + ' 150.5 22.5)');
  }, INTERVAL);
})();
</script>
