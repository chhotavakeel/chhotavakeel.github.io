<h1>{{ page.title }}</h1>
{%- include WikiLinks.html -%}
{%- if site.preferences.backlinks.enabled -%}
{%- include Backlinks.html -%}
{%- endif -%}

<script>
// Hover previews for wiki links (excerpt is baked in at build time).
document.addEventListener('DOMContentLoaded', function () {
    function hidePreview() {
        var existing = document.querySelector('.link-preview');
        if (existing) existing.remove();
    }

    document.querySelectorAll('.wiki-link[data-excerpt]').forEach(function (link) {
        link.addEventListener('mouseenter', function () {
            hidePreview();
            var preview = document.createElement('div');
            preview.className = 'link-preview';
            var title = document.createElement('strong');
            title.textContent = link.dataset.title;
            var excerpt = document.createElement('p');
            excerpt.textContent = link.dataset.excerpt;
            var wrap = document.createElement('div');
            wrap.className = 'preview-content';
            wrap.appendChild(title);
            wrap.appendChild(excerpt);
            preview.appendChild(wrap);
            document.body.appendChild(preview);
            var rect = link.getBoundingClientRect();
            preview.style.position = 'fixed';
            preview.style.left = rect.left + 'px';
            preview.style.top = (rect.bottom + 5) + 'px';
            preview.style.zIndex = '1000';
        });
        link.addEventListener('mouseleave', hidePreview);
    });
});
</script>
